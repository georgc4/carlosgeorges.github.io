<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" fill="none" role="img" aria-labelledby="console-title console-desc">
  <title id="console-title">Linux on a console</title>
  <desc id="console-desc">Conceptual illustration of a black console with a narrow blue light, alongside a terminal panel listing Linux, AMDGPU, and Vulkan.</desc>
  <defs>
    <pattern id="console-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <path fill="#000000" d="M0 0h480v230H0z"/>
  <path fill="url(#console-grid)" d="M0 0h480v230H0z"/>

  <!-- A diagrammatic terminal, deliberately not a product screenshot. -->
  <rect x="281" y="37" width="164" height="147" fill="#080808" stroke="#aaaaaa" stroke-opacity=".3"/>
  <path d="M281 64h164" stroke="#aaaaaa" stroke-opacity=".13"/>
  <circle cx="296" cy="51" r="2.5" fill="#ff3333"/>
  <circle cx="306" cy="51" r="2.5" fill="#ffff00"/>
  <circle cx="316" cy="51" r="2.5" fill="#00ff00"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="295" y="88" fill="#aaaaaa" font-size="9" letter-spacing="1.1">SOFTWARE STACK</text>
    <text x="295" y="113" fill="#00ff00" font-size="12">$</text>
    <text x="311" y="113" fill="#00ff00" font-size="12">Linux</text>
    <text x="311" y="136" fill="#00ffff" font-size="12">AMDGPU</text>
    <text x="311" y="159" fill="#ff00ff" font-size="12">Vulkan</text>
  </g>
  <path d="M299 124v30h5M299 131h5" stroke="#888888" stroke-opacity=".55"/>
  <path d="M425 106v55" stroke="#aaaaaa" stroke-opacity=".15"/>
  <path d="M425 108v13" stroke="#aaaaaa" stroke-opacity=".5" stroke-linecap="round"/>

  <!-- Two low, offset slabs give the console its recognizable silhouette. -->
  <path d="m46 130 113-33 115 63-113 36z" fill="#282828"/>
  <path d="m46 130 115 66-2 14-113-64z" fill="#141414"/>
  <path d="m161 196 113-36-2 14-113 36z" fill="#1b1b1b"/>
  <path d="m47 130 114 65 112-35" stroke="#888888" stroke-opacity=".2"/>

  <path d="m52 100 113-32 115 62-113 35z" fill="#333333"/>
  <path d="m52 100 115 65-5 23-115-65z" fill="#141414"/>
  <path d="m167 165 113-35-6 23-112 35z" fill="#222222"/>
  <path d="m53 100 114 64 112-34" stroke="#bbbbbb" stroke-opacity=".23"/>
  <path d="m165 68 115 62" stroke="#999999" stroke-opacity=".2"/>

  <path d="m124 80 114 63" stroke="#111111" stroke-width="1.7"/>
  <path d="m123 80 114 63" stroke="#cccccc" stroke-opacity=".13" stroke-width=".6"/>
  <path d="m50 128 113 64" stroke="#00ffff" stroke-width="1.3"/>
  <path d="m164 192 111-35" stroke="#3355ff" stroke-opacity=".4" stroke-width=".8"/>
  <path d="m73 137 39 22" stroke="#000000" stroke-width="2.3" stroke-linecap="round"/>
  <path d="m122 165 10 5.8m8 4.4 10 5.8" stroke="#888888" stroke-opacity=".5" stroke-width="1.5"/>
  <path d="m183 179 61-19" stroke="#080808" stroke-width="2"/>
  <path d="m185 200 59-19" stroke="#080808" stroke-width="2"/>

  <!-- Quiet reference marks keep the image closer to a technical plate. -->
  <path d="M32 42V32h10M448 198v10h-10" stroke="#aaaaaa" stroke-opacity=".28"/>
  <path d="M44 59h45M44 63h22" stroke="#aaaaaa" stroke-opacity=".16"/>
  <path d="M292 199h91" stroke="#aaaaaa" stroke-opacity=".16"/>
  <circle cx="391" cy="199" r="2" fill="#00ff00" fill-opacity=".55"/>
</svg>
